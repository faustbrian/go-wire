name: Interop hardening

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Extended fuzzing
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: jsonwire
            target: FuzzDecode
          - package: xmlwire
            target: FuzzDecode
          - package: soap
            target: FuzzParse
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.x
      - name: Fuzz parser
        run: go test -run '^$' -fuzz=${{ matrix.target }} -fuzztime=2m ./${{ matrix.package }}

  benchmarks:
    name: Benchmark baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.x
      - name: Run representative benchmarks
        run: go test -run '^$' -bench . -benchmem -benchtime=2s -count=5 ./...
