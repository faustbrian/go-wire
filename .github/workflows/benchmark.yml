name: Benchmarks

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * 1"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - jsonwire
          - xmlwire
          - soap
          - yamlwire
          - tomlwire
          - msgpackwire
          - cborwire
          - bsonwire
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run benchmarks
        run: go test -run='^$' -bench=. -benchmem ./${{ matrix.package }} | tee benchmark.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.package }}
          path: benchmark.txt
